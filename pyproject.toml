[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-trend"
version = "0.1.0"
description = "Automated topic assignment and trend analysis for biology-journal RSS feeds"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
curate = ["spacy>=3.4.1,<3.5.0", "scispacy==0.5.1"]  # `bio-trend candidates` (scispaCy NER)
citations = ["requests>=2.28"]                        # `bio-trend citations` (S2 / OpenAlex)

[project.scripts]
bio-trend = "bio_trend.cli:main"

[tool.setuptools]
packages = ["bio_trend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
