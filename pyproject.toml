[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-trend"
version = "0.1.0"
description = "Automated topic assignment and trend analysis for biology-journal RSS feeds"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
# `bio-trend candidates` (scispaCy NER). Needs numpy 1.x (thinc/blis ABI) and
# setuptools<81 (spaCy 3.4 imports pkg_resources). Install the biomedical model
# separately from S3 — see README / CLAUDE.md:
#   pip install "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.1/en_core_sci_lg-0.5.1.tar.gz"
curate = ["spacy>=3.4.1,<3.5.0", "numpy==1.23.5", "setuptools<81"]
citations = ["requests>=2.28"]  # `bio-trend citations` (Semantic Scholar / OpenAlex)
backfill = ["requests>=2.28"]   # `bio-trend backfill` (Crossref)

[project.scripts]
bio-trend = "bio_trend.cli:main"

[tool.setuptools]
packages = ["bio_trend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
